## One stack definition for both local development and the ccti.gt deployment.
## Everything that differs between the two is a value in .env (gitignored);
## see .env.example.

services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      # The container serves the checked-out source at /app, so on the server a
      # `git pull` plus `docker compose restart api` ships code. Dependencies
      # come from the image, so run `docker compose up -d --build` instead
      # whenever requirements.txt changes.
      - .:/app
    ports:
      # Published on loopback only: TLS and the public hostname
      # (python-api.ccti.gt) are terminated by the host's reverse proxy, which
      # forwards to this port. Set API_BIND=0.0.0.0 only if that proxy runs on
      # a different machine.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-7400}:7000"
    environment:
      # These take precedence over the .env file that the bind mount exposes at
      # /app/.env: pydantic-settings ranks real environment variables above
      # env_file, which is what keeps the container pointed at host `db` rather
      # than at the localhost address .env carries for host-run uvicorn.
      DATABASE_URL: mysql+pymysql://${DB_USER:-attendance}:${DB_PASSWORD:-attendance}@db:3306/${DB_NAME:-attendance}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Browser origins allowed to call this API. The frontend is served from a
      # different hostname, so every request from it is cross-origin and that
      # hostname must be listed here exactly, scheme included.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
    # RELOAD is empty unless .env sets it, so the default is production
    # behaviour; the local .env sets RELOAD=--reload for hot reloading.
    #
    # --proxy-headers makes uvicorn trust X-Forwarded-Proto/-For from the
    # reverse proxy, so the app sees the public https scheme and the real client
    # IP rather than the proxy's. --forwarded-allow-ips '*' is needed because
    # the proxy arrives from the Docker bridge gateway, whose address is not
    # fixed; only loopback can reach this port, so no outsider can forge those.
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 7000 --proxy-headers --forwarded-allow-ips '*' ${RELOAD:-}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-attendance}
      MYSQL_USER: ${DB_USER:-attendance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-attendance}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      # Loopback only, so local tools (TablePlus, mysql CLI) can connect while
      # the internet cannot. The non-default host port avoids colliding with a
      # MySQL already listening on 3306.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-33067}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-attendance}", "-p${DB_PASSWORD:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
